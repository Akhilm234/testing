name: sample pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: build job
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t my-image:0.1 .

      - name: save image
        run: docker save my-image:0.1 -o my-image.tar

      - name: upload image
        uses: actions/upload-artifact@v4
        with:
          name: build image file
          path: my-image.tar

  test:
    name: test job
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download image
        uses: actions/download-artifact@v4
        with:
          name: build image file

      - name: load image
        run: docker load -i my-image.tar

      - name: run image
        run: docker run -d -p 8080:80 --name my-cont my-image:0.1

      - name: test application
        run: |
          sleep 10
          curl http://localhost:8080/

      - name: stop container
        if: always()
        run: docker rm -f my-cont
